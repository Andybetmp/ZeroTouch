<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bateas Zero-Touch | Onboarding 360 — Equipo MYOPIA</title>
    <style>
      @keyframes bootBar {
        0% { transform: translateX(-65%); }
        100% { transform: translateX(220%); }
      }
      .bateas-boot-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        padding: 24px;
      }
      .bateas-boot-card {
        width: 100%;
        max-width: 360px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
      }
      .bateas-boot-logo {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: #047857;
        color: #ffffff;
        font-weight: 900;
        font-size: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 14px;
      }
      .bateas-boot-track {
        height: 4px;
        background: #e2e8f0;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 18px;
      }
      .bateas-boot-fill {
        width: 45%;
        height: 100%;
        background: #047857;
        border-radius: 999px;
        animation: bootBar 1.2s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .bateas-boot-fill { animation: none; width: 60%; }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root">
      <div class="bateas-boot-shell" role="status" aria-live="polite">
        <div class="bateas-boot-card">
          <div class="bateas-boot-logo">B</div>
          <div style="font-size:15px;font-weight:700;color:#0f172a;">App Bateas v3.0 · Zero-Touch</div>
          <div style="font-size:12px;color:#64748b;margin-top:4px;">Iniciando plataforma de habilitación...</div>
          <div class="bateas-boot-track"><div class="bateas-boot-fill"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
